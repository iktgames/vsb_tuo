<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VŠB Kampus Quest</title>
<style>
:root{
  --bg:#070b14; --bg2:#0b1120; --card:#0e1626; --card-border:#1c2a42;
  --cyan:#22d3ee; --cyan-dim:#0e7490; --text:#e7edf5; --muted:#8ba0bd;
  --good:#34d399; --bad:#f87171; --gold:#fbbf24;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top,#0d1830 0%,var(--bg) 55%);
  color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh; position:relative; overflow-x:hidden;
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.dot{position:absolute;border-radius:50%;background:var(--cyan);opacity:.5;animation:float 12s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-30px);opacity:.6}}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:24px 16px 60px;}
.card{
  background:linear-gradient(180deg,var(--card),#0a1220);
  border:1px solid var(--card-border); border-radius:20px; padding:28px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
}
h1{font-size:1.5rem;letter-spacing:.5px;display:flex;align-items:center;gap:10px;margin:0 0 4px;text-transform:uppercase;}
h1 .ico{color:var(--cyan);}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:20px;}
hr{border:none;border-top:1px solid var(--card-border);margin:18px 0;}
label{display:block;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:8px;}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.label-row label{margin-bottom:0;}
input[type=text], textarea{
  width:100%;background:#0a1222;border:1px solid var(--card-border);border-radius:12px;
  color:var(--text);padding:14px 16px;font-size:1rem;outline:none;transition:border .2s;
}
input[type=text]:focus, textarea:focus{border-color:var(--cyan);}
textarea{resize:vertical;min-height:80px;font-family:inherit;}
.row{display:flex;gap:10px;}
.row input{flex:1;}
.btn{
  border:none;border-radius:12px;padding:14px 18px;font-weight:700;font-size:.9rem;
  cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:transform .15s, opacity .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-dim));color:#03131a;width:100%;}
.btn-primary:disabled{background:#1a2333;color:#4a5a72;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1px solid var(--card-border);color:var(--cyan);}
.btn-add{background:#0d3a4a;color:var(--cyan);white-space:nowrap;}
.link-btn{background:none;border:none;color:var(--cyan);font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.5px;}
.app-footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:22px;padding:0 12px;}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:14px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;}
.pill{background:#0a1222;border:1px solid var(--card-border);border-radius:999px;padding:8px 16px;font-size:.8rem;font-weight:700;color:var(--gold);}
.pill-stations{background:#0a1626;border:1px solid var(--card-border);border-radius:999px;padding:11px 20px;font-size:.85rem;font-weight:800;letter-spacing:.5px;color:var(--cyan);text-transform:uppercase;}
.pill-stations b{color:#fff;font-weight:800;}
.pill-points{background:#1a1408;border:1px solid #4a3a12;border-radius:999px;padding:11px 20px;font-size:.85rem;font-weight:800;letter-spacing:.5px;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.progress-track{height:7px;background:#0a1222;border-radius:999px;overflow:hidden;margin-bottom:22px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--good));transition:width .4s;}
.station-card-inner{border:1px solid var(--card-border);border-radius:20px;padding:22px;background:#0a1222;margin-bottom:18px;}
.station-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;}
.station-icon{width:56px;height:56px;border-radius:16px;border:1px solid #1c3a4a;background:#0a1626;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--cyan);font-size:1.5rem;}
.station-icon .gps-glyph{display:inline-block;transform:rotate(-45deg);}
.station-meta{flex:1;min-width:0;}
.station-cat{font-size:.72rem;font-weight:800;letter-spacing:1px;color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.station-cat::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan);display:inline-block;flex-shrink:0;}
.station-points-pill{background:#0a1626;border:1px solid var(--cyan-dim);border-radius:999px;padding:7px 15px;font-size:.8rem;font-weight:800;color:var(--cyan);white-space:nowrap;flex-shrink:0;}
.station-desc-box{background:#070d18;border:1px solid var(--card-border);border-radius:14px;padding:18px;color:#c7d4e6;font-size:.95rem;line-height:1.6;}
.station-body{padding:0 2px;}
.badge{display:inline-block;background:#0d3a4a;color:var(--cyan);font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:10px;}
.station-title{font-size:1.35rem;font-weight:800;margin:0;line-height:1.25;}
.station-desc{color:var(--muted);font-size:.92rem;line-height:1.55;margin-bottom:18px;}
.quiz-opt{display:block;width:100%;text-align:left;background:#0a1222;border:1px solid var(--card-border);border-radius:12px;padding:14px 16px;color:var(--text);margin-bottom:10px;cursor:pointer;font-size:.92rem;transition:border .15s,background .15s;}
.quiz-opt:hover{border-color:var(--cyan);}
.quiz-opt.selected{border-color:var(--cyan);background:#0d3a4a;}
.quiz-opt.correct{border-color:var(--good);background:#0d3a2a;}
.quiz-opt.wrong{border-color:var(--bad);background:#3a0d16;}
.feedback{border-radius:12px;padding:12px 14px;font-size:.88rem;margin-top:12px;display:none;}
.feedback.good{background:#0d3a2a;color:var(--good);display:block;}
.feedback.bad{background:#3a0d16;color:var(--bad);display:block;}
.compass{display:flex;flex-direction:column;align-items:center;gap:10px;margin:16px 0;}
.compass-ring{width:150px;height:150px;border-radius:50%;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle,#0a1222,#070b14);}
.compass-arrow{font-size:2.6rem;color:var(--cyan);transition:transform .3s ease;}
.dist{font-size:1.6rem;font-weight:800;color:var(--gold);}
.dist small{display:block;font-size:.7rem;color:var(--muted);font-weight:400;text-transform:uppercase;}
.photo-zone{border:2px dashed var(--card-border);border-radius:14px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:14px;}
.photo-zone img{max-width:100%;border-radius:10px;display:block;margin:0 auto;}
.station-list{margin-top:22px;display:flex;flex-direction:column;gap:8px;}
.station-row{display:flex;align-items:center;gap:12px;background:#0a1222;border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;font-size:.85rem;}
.station-row.done{opacity:.55;}
.station-row .dot-icon{width:8px;height:8px;border-radius:50%;background:var(--card-border);flex-shrink:0;}
.station-row.active .dot-icon{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
.station-row.done .dot-icon{background:var(--good);}
.lock{color:var(--muted);font-size:.9rem;}
.final-icon{font-size:3rem;text-align:center;margin-bottom:6px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0;}
.stat-box{background:#0a1222;border:1px solid var(--card-border);border-radius:12px;padding:16px;text-align:center;}
.stat-box .num{font-size:1.6rem;font-weight:800;color:var(--cyan);}
.stat-box .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
table.report{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:10px;}
table.report th, table.report td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--card-border);}
table.report th{color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;}
.hidden{display:none !important;}
.small-note{font-size:.72rem;color:var(--muted);margin-top:6px;}
.chapter-banner{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#0d3a4a,#0a1626);border:1px solid var(--cyan-dim);}
.chapter-banner .cico{font-size:1.2rem;}
.chapter-banner .ctxt{font-size:.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);}
.chapter-banner .ctxt small{display:block;font-size:.65rem;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;margin-top:2px;}
.station-images{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
.station-images img{width:100%;border-radius:14px;border:1px solid var(--card-border);display:block;background:#fff;}
.images-caption{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:-2px;}
audio{width:100%;margin-top:10px;border-radius:10px;}
</style>
</head>
<body>
<div id="particles"></div>
<div class="wrap">

  <!-- REGISTRATION SCREEN -->
  <div class="card" id="screen-register">
    <h1><span class="ico">👥</span> Registrace týmu</h1>
    <hr>
    <div class="label-row">
      <label>Název týmu:</label>
      <button class="link-btn" id="randomNameBtn">🔀 Náhodný název</button>
    </div>
    <div class="row">
      <input type="text" id="teamName" placeholder="Zadejte název vašeho týmu…" maxlength="40">
    </div>

    <button class="btn btn-primary" id="startBtn" style="margin-top:22px;" disabled>🧭 Spustit hru a vyrazit do kampusu</button>
    <div class="hint" id="startHint">Zadejte název týmu pro spuštění.</div>
  </div>

  <div class="app-footer">VŠB – Technická univerzita Ostrava • Výzkumné centrum IT4Innovations • Geocaching Actionbound Quest</div>

  <!-- GAME SCREEN -->
  <div class="card hidden" id="screen-game">
    <div class="top-bar">
      <div class="pill-stations">STANICE <b id="gameStationCount">1/12</b></div>
      <div class="pill-points">🪙 BODY: <span id="gamePoints">0 b</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div id="stationArea"></div>
  </div>

  <!-- FINAL / PROTOCOL SCREEN -->
  <div class="card hidden" id="screen-final">
    <div class="final-icon">🏁</div>
    <h1 style="text-align:center;justify-content:center;">Hra dokončena!</h1>
    <div class="sub" style="text-align:center;" id="finalTeamLine"></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num" id="finalPoints">0</div><div class="lbl">Bodů celkem</div></div>
      <div class="stat-box"><div class="num" id="finalStations">0/0</div><div class="lbl">Stanovišť</div></div>
      <div class="stat-box"><div class="num" id="finalTime">–</div><div class="lbl">Celkový čas</div></div>
      <div class="stat-box"><div class="num" id="finalAttempts">0</div><div class="lbl">Chybných pokusů</div></div>
    </div>
    <table class="report" id="reportTable"></table>
    <button class="btn btn-primary" id="downloadBtn" style="margin-top:20px;">⬇ Stáhnout protokol</button>
    <button class="btn btn-ghost" id="restartBtn" style="margin-top:10px;width:100%;">Nová hra</button>
  </div>

</div>

<script>
/* ---------- Particle background ---------- */
(function(){
  const c = document.getElementById('particles');
  for(let i=0;i<26;i++){
    const d = document.createElement('div');
    d.className='dot';
    const s = Math.random()*4+2;
    d.style.width=s+'px'; d.style.height=s+'px';
    d.style.left=Math.random()*100+'%';
    d.style.top=Math.random()*100+'%';
    d.style.animationDelay=(Math.random()*10)+'s';
    d.style.animationDuration=(8+Math.random()*10)+'s';
    c.appendChild(d);
  }
})();

const ALL_ITEMS = {};
CHAPTERS.forEach(ch=>{ ch.items.forEach(it=>{ it.chapterTitle = ch.title; ALL_ITEMS[it.id] = it; }); });

function buildOrder(){
  const order = [];
  CHAPTERS.forEach(ch=>{
    if(ch.mode==='shuffle'){
      order.push(...shuffle(ch.items.map(i=>i.id)));
    } else if(ch.mode==='pickone'){
      order.push(ch.items[Math.floor(Math.random()*ch.items.length)].id);
    } else {
      order.push(...ch.items.map(i=>i.id));
    }
  });
  return order;
}


const RANDOM_TEAM_NAMES = ['Kampus Rangers','Piráti z Poruby','Team Kompas','Bitová Legie','Hackerská Smečka','Poruba Runners','Neon Prváci','Signál 4.0'];

/* ---------- State ---------- */
let state = {
  teamName:'', order:[], current:0,
  points:0, wrongAttempts:0, startedAt:0, log:[], done:{}
};
let watchId = null;

const $ = id => document.getElementById(id);

/* ---------- Registration screen ---------- */
$('randomNameBtn').addEventListener('click', ()=>{
  $('teamName').value = RANDOM_TEAM_NAMES[Math.floor(Math.random()*RANDOM_TEAM_NAMES.length)];
  validateRegister();
});
$('teamName').addEventListener('input', validateRegister);

function validateRegister(){
  const ok = $('teamName').value.trim().length>0;
  $('startBtn').disabled = !ok;
  $('startHint').textContent = ok ? 'Vše připraveno — hodně štěstí!' : 'Zadejte název týmu pro spuštění.';
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('startBtn').addEventListener('click', ()=>{
  state.teamName = $('teamName').value.trim();
  state.startedAt = Date.now();
  state.order = buildOrder();
  state.current = 0;
  saveState();
  showScreen('game');
  renderStation();
});
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------- Screen switching ---------- */
function showScreen(name){
  ['register','game','final'].forEach(s=>{
    $('screen-'+s).classList.toggle('hidden', s!==name);
  });
}

/* ---------- Game rendering ---------- */
function stationById(id){ return ALL_ITEMS[id]; }
function scoreLabel(base, points){ return points>0 ? base+' (+'+points+' b)' : base; }
function renderStationImages(images, caption, area){
  if(!images || !images.length) return;
  const box = document.createElement('div'); box.className='station-images';
  if(caption){ const cap=document.createElement('div'); cap.className='images-caption'; cap.textContent=caption; box.appendChild(cap); }
  images.forEach(src=>{ const img=document.createElement('img'); img.src=src; img.loading='lazy'; box.appendChild(img); });
  area.appendChild(box);
}

const TYPE_META = {
  gps:    {icon:'<span class="gps-glyph">➤</span>', label:'GPS lokalizace'},
  photo:  {icon:'📷', label:'Foto úkol'},
  quiz:   {icon:'❓', label:'Kvíz'},
  text:   {icon:'⌨',  label:'Textová odpověď'},
  reflect:{icon:'📝', label:'Otevřená odpověď'},
  audio:  {icon:'🎙️', label:'Zvuková nahrávka'}
};

function renderStation(){
  $('gameStationCount').textContent = (state.current+1)+'/'+state.order.length;
  $('gamePoints').textContent = state.points+' b';
  $('progressFill').style.width = Math.round((Object.keys(state.done).length/state.order.length)*100)+'%';

  if(state.current >= state.order.length){
    finishGame();
    return;
  }
  const st = stationById(state.order[state.current]);
  const area = $('stationArea');
  area.innerHTML='';

  const prevSt = state.current>0 ? stationById(state.order[state.current-1]) : null;
  if(st.chapterTitle && (!prevSt || prevSt.chapterTitle!==st.chapterTitle)){
    const banner = document.createElement('div'); banner.className='chapter-banner';
    banner.innerHTML = `<span class="cico">🎬</span><span class="ctxt">${escapeHtml(st.chapterTitle)}</span>`;
    area.appendChild(banner);
  }

  const meta = TYPE_META[st.type] || {icon:'•', label:'Úkol'};

  const cardInner = document.createElement('div');
  cardInner.className = 'station-card-inner';

  const head = document.createElement('div'); head.className='station-head';
  head.innerHTML = `
    <div class="station-icon">${meta.icon}</div>
    <div class="station-meta">
      <div class="station-cat">${meta.label}</div>
      <div class="station-title">${escapeHtml(st.title)}</div>
    </div>
    ${st.points>0 ? `<div class="station-points-pill">+${st.points} b</div>` : ''}
  `;
  cardInner.appendChild(head);

  const descBox = document.createElement('div'); descBox.className='station-desc-box';
  descBox.textContent = st.desc;
  cardInner.appendChild(descBox);

  renderStationImages(st.images, st.imagesCaption, cardInner);

  area.appendChild(cardInner);

  const body = document.createElement('div'); body.className='station-body';
  area.appendChild(body);

  if(st.type==='text'){ renderText(st, body); }
  else if(st.type==='quiz'){ renderQuiz(st, body); }
  else if(st.type==='gps'){ renderGps(st, body); }
  else if(st.type==='photo'){ renderPhoto(st, body); }
  else if(st.type==='reflect'){ renderReflect(st, body); }
  else if(st.type==='audio'){ renderAudio(st, body); }
}

/* ----- text-answer station ----- */
function renderText(st, area){
  const input = document.createElement('input');
  input.type='text'; input.placeholder='Zadejte odpověď…';
  area.appendChild(input);
  const fb = document.createElement('div'); fb.className='feedback'; area.appendChild(fb);
  const btn = document.createElement('button');
  btn.className='btn btn-primary'; btn.style.marginTop='14px'; btn.textContent=scoreLabel('Ověřit odpověď', st.points);
  area.appendChild(btn);

  btn.addEventListener('click', ()=>{
    const norm = normalize(input.value);
    let ok;
    if(st.requireAll){
      ok = st.accept.every(k=>norm.includes(normalize(k)));
    } else {
      ok = st.accept.some(k=>norm.includes(normalize(k)));
    }
    if(ok){
      fb.className='feedback good'; fb.textContent='Správně! Body připsány.';
      completeStation(st, {answer:input.value});
    } else {
      state.wrongAttempts++;
      fb.className='feedback bad'; fb.textContent = st.hintWrong || 'To není ono, zkus to znovu.';
    }
  });
}
function normalize(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

/* ----- quiz station ----- */
function renderQuiz(st, area){
  let selected = -1, checked=false;
  const optBox = document.createElement('div');
  st.options.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='quiz-opt'; b.textContent = String.fromCharCode(65+i)+') '+opt;
    b.addEventListener('click', ()=>{
      if(checked) return;
      selected=i;
      [...optBox.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
    });
    optBox.appendChild(b);
  });
  area.appendChild(optBox);
  const fb = document.createElement('div'); fb.className='feedback'; area.appendChild(fb);
  const btn = document.createElement('button');
  btn.className='btn btn-primary'; btn.style.marginTop='6px'; btn.textContent=scoreLabel('Ověřit odpověď', st.points);
  area.appendChild(btn);

  btn.addEventListener('click', ()=>{
    if(selected===-1 || checked) return;
    checked = true;
    [...optBox.children].forEach((c,i)=>{
      if(i===st.correct) c.classList.add('correct');
      else if(i===selected) c.classList.add('wrong');
    });
    if(selected===st.correct){
      fb.className='feedback good'; fb.textContent='Správně! Body připsány.';
      completeStation(st, {answer:st.options[selected]});
    } else {
      state.wrongAttempts++;
      const penalty = st.penalty||0;
      if(penalty>0) state.points = Math.max(0, state.points-penalty);
      fb.className='feedback bad';
      fb.textContent = 'Bohužel špatně — správná odpověď je zvýrazněna.'+(penalty>0?' Penalizace: -'+penalty+' b.':' Body se v tomto pokusu nezapočítávají.');
      btn.disabled = true; btn.style.opacity=.5;
      setTimeout(()=>{ completeStation(st, {answer:st.options[selected], wrong:true}); }, 1600);
    }
  });
}

/* ----- reflection (open text) station ----- */
function renderReflect(st, area){
  const ta = document.createElement('textarea');

/* ----- photo station ----- */
function renderPhoto(st, area){
  const zone = document.createElement('div'); zone.className='photo-zone';
  zone.textContent = '📷 Klepnutím vyfoť nebo nahraj fotku vstupu';
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.capture='environment'; input.style.display='none';
  area.appendChild(zone); area.appendChild(input);
  const btn = document.createElement('button');
  btn.className='btn btn-primary'; btn.style.marginTop='14px'; btn.textContent=scoreLabel('Potvrdit fotku', st.points);
  btn.disabled = true;
  area.appendChild(btn);

  zone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      zone.innerHTML=''; const img = document.createElement('img'); img.src=e.target.result; zone.appendChild(img);
      btn.disabled=false;
    };
    reader.readAsDataURL(file);
  });
  btn.addEventListener('click', ()=>{
    completeStation(st, {answer:'fotka pořízena'});
  });
}

/* ----- audio station ----- */
function renderAudio(st, area){
  let mediaRecorder=null, chunks=[], recording=false;
  const zone = document.createElement('div'); zone.className='photo-zone';
  zone.textContent = '🎙️ Klepnutím spusť nahrávání zvuku';
  area.appendChild(zone);
  const audioPreview = document.createElement('audio'); audioPreview.controls=true; audioPreview.style.display='none';
  area.appendChild(audioPreview);
  const fileInput = document.createElement('input');
  fileInput.type='file'; fileInput.accept='audio/*'; fileInput.capture='microphone'; fileInput.style.display='none';
  area.appendChild(fileInput);
  const note = document.createElement('div'); note.className='small-note';
  note.textContent = 'Pokud nahrávání v prohlížeči nefunguje, klepnutím nahraj hotový zvukový soubor.';
  area.appendChild(note);
  const btn = document.createElement('button');
  btn.className='btn btn-primary'; btn.style.marginTop='14px'; btn.textContent=scoreLabel('Potvrdit nahrávku', st.points);
  btn.disabled = true;
  area.appendChild(btn);

  zone.addEventListener('click', async ()=>{
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder){
      if(!recording){
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          chunks = [];
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e=>chunks.push(e.data);
          mediaRecorder.onstop = ()=>{
            const blob = new Blob(chunks, {type:'audio/webm'});
            audioPreview.src = URL.createObjectURL(blob);
            audioPreview.style.display='block';
            btn.disabled = false;
            stream.getTracks().forEach(t=>t.stop());
          };
          mediaRecorder.start();
          recording = true;
          zone.textContent = '⏺ Nahrávám… klepnutím ukonči nahrávání';
        }catch(e){
          fileInput.click();
        }
      } else {
        mediaRecorder.stop();
        recording = false;
        zone.textContent = '🎙️ Nahrávka pořízena — klepnutím nahraj novou';
      }
    } else {
      fileInput.click();
    }
  });
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0]; if(!file) return;
    audioPreview.src = URL.createObjectURL(file);
    audioPreview.style.display='block';
    btn.disabled = false;
    zone.textContent = '🎙️ Soubor nahrán — klepnutím nahraj jiný';
  });
  btn.addEventListener('click', ()=>{
    completeStation(st, {answer:'zvuková nahrávka pořízena'});
  });
}

/* ----- GPS station ----- */
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearing(lat1,lon1,lat2,lon2){
  const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI;
  const y=Math.sin(toRad(lon2-lon1))*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lon2-lon1));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function renderGps(st, area){
  const wrap = document.createElement('div'); wrap.className='compass';
  wrap.innerHTML = `
    <div class="compass-ring"><div class="compass-arrow" id="cArrow">↑</div></div>
    <div class="dist"><span id="cDist">–</span> m<small>vzdálenost k cíli</small></div>
    <div class="small-note" id="cStatus">Povol prosím přístup k poloze…</div>
  `;
  area.appendChild(wrap);
  const btn = document.createElement('button');
  btn.className='btn btn-primary'; btn.style.marginTop='10px'; btn.textContent=scoreLabel('Potvrdit příchod', st.points);
  btn.disabled = true;
  area.appendChild(btn);

  if(!('geolocation' in navigator)){
    $('cStatus').textContent = 'Tvé zařízení nepodporuje GPS. Popros vyučujícího o manuální potvrzení.';
    btn.disabled = false;
    btn.addEventListener('click', ()=>completeStation(st, {answer:'manuálně potvrzeno (bez GPS)'}));
    return;
  }

  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude:lat, longitude:lng} = pos.coords;
    const d = Math.round(haversine(lat,lng,st.lat,st.lng));
    const brg = bearing(lat,lng,st.lat,st.lng);
    document.getElementById('cDist').textContent = d;
    document.getElementById('cArrow').style.transform = `rotate(${brg}deg)`;
    if(d<=st.radius){
      document.getElementById('cStatus').textContent = 'Jsi v cíli! Potvrď příchod.';
      btn.disabled = false;
    } else {
      document.getElementById('cStatus').textContent = 'Sleduj kompas a blíž se k cíli.';
      btn.disabled = true;
    }
  }, err=>{
    document.getElementById('cStatus').textContent = 'Nepodařilo se získat polohu ('+err.message+'). Zkontroluj oprávnění GPS.';
  }, {enableHighAccuracy:true, maximumAge:2000, timeout:10000});

  btn.addEventListener('click', ()=>{
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    completeStation(st, {answer:'dorazil na místo'});
  });
}

/* ----- completing a station ----- */
function completeStation(st, extra){
  const awarded = extra.wrong ? 0 : st.points;
  state.points += awarded;
  state.done[st.id] = {points:awarded, at:Date.now(), ...extra};
  state.log.push({id:st.id, title:st.title, points:awarded, ...extra});
  state.current++;
  saveState();
  renderStation();
}

/* ----- finishing the game ----- */
function finishGame(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  showScreen('final');
  const elapsedMs = Date.now()-state.startedAt;
  const mins = Math.floor(elapsedMs/60000), secs = Math.floor((elapsedMs%60000)/1000);
  $('finalTeamLine').textContent = state.teamName;
  $('finalPoints').textContent = state.points;
  $('finalStations').textContent = Object.keys(state.done).length+'/'+state.order.length;
  $('finalTime').textContent = mins+'m '+secs+'s';
  $('finalAttempts').textContent = state.wrongAttempts;

  const table = $('reportTable');
  table.innerHTML = '<tr><th>#</th><th>Stanoviště</th><th>Body</th></tr>' +
    state.log.map((l,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(l.title)}</td><td>${l.points} b</td></tr>`).join('');
}

$('downloadBtn').addEventListener('click', downloadProtocol);
$('restartBtn').addEventListener('click', ()=>{
  localStorage.removeItem('vsbQuestState');
  state = {teamName:'', order:[], current:0, points:0, wrongAttempts:0, startedAt:0, log:[], done:{}};
  $('teamName').value=''; validateRegister();
  showScreen('register');
});

function downloadProtocol(){
  const elapsedMs = Date.now()-state.startedAt;
  const mins = Math.floor(elapsedMs/60000), secs = Math.floor((elapsedMs%60000)/1000);
  const lines = [];
  lines.push('=========================================');
  lines.push('   VŠB KAMPUS QUEST — PROTOKOL VÝSLEDKŮ');
  lines.push('=========================================');
  lines.push('');
  lines.push('Tým: '+state.teamName);
  lines.push('Datum: '+new Date().toLocaleString('cs-CZ'));
  lines.push('Celkový čas: '+mins+' min '+secs+' s');
  lines.push('Chybné pokusy: '+state.wrongAttempts);
  lines.push('Splněno stanovišť: '+Object.keys(state.done).length+'/'+state.order.length);
  lines.push('CELKOVÝ POČET BODŮ: '+state.points);
  lines.push('');
  lines.push('-----------------------------------------');
  lines.push('Přehled stanovišť:');
  lines.push('-----------------------------------------');
  state.log.forEach((l,i)=>{
    lines.push((i+1)+'. '+l.title+' — '+l.points+' b'+(l.answer? ' (odpověď: '+l.answer+')':''));
  });
  lines.push('');
  lines.push('=========================================');

  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'protokol_'+state.teamName.replace(/\s+/g,'_')+'.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- persistence ---------- */
function saveState(){
  try{ localStorage.setItem('vsbQuestState', JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('vsbQuestState');
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(saved && saved.teamName && saved.order && saved.order.length){
      state = saved;
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------- init ---------- */
(function init(){
  validateRegister();
  if(loadState()){
    $('teamName').value = state.teamName;
    if(state.current >= state.order.length){
      showScreen('final'); finishGame();
    } else {
      showScreen('game'); renderStation();
    }
  }
})();
</script>
</body>
