**Superpočítač** je počítač, který je mnohonásobně výkonnější než běžný počítač. Dokáže za krátkou dobu udělat **obrovské množství výpočtů**, které by běžnému počítači trvaly velmi dlouho.

Představ si například, že jeden člověk má spočítat **milion příkladů**. Zabralo by mu to dlouhou dobu. Superpočítač dokáže takovou práci **rozdělit mezi velké množství počítačových částí**, které počítají současně.

Jak to funguje?

Představ si, že vědec potřebuje zjistit něco z velkého množství dat.

👨🔬 **Člověk zadá úkol**
Například chce zpracovat velké množství naměřených dat.

💾 **Systém si vezme potřebná data**
Počítač najde a načte data, která jsou uložená v úložišti nebo databázi.

🧠 **Superpočítač data zpracuje**
Obrovské množství výpočtů provádí najednou, takže úloha může být hotová mnohem rychleji než na běžném počítači.

📊 **Výsledek se uloží a zobrazí**
Výsledek výpočtu se uloží a člověk ho může dále využít.
