Cílem je pochopit, že principy informačních systémů, které poznáváme ve škole, se používají i ve skutečném světě – jen ve **větším měřítku a pro náročnější úkoly**.

Na VŠB-TUO se podíváme, jak informační technologie fungují v prostředí vysoké školy a výzkumu. Zaměříme se například na to, **jak se pracuje s daty, kde jsou data uložena, kdo k nim má přístup a jak se jednotlivé systémy a služby používají**.`,hint:"Stiskněte tlačítko Přehrát hlasovku a pozorně poslouchejte. Po doznění výkladu se zobrazí tlačítko pro přechod na další úkol.",explanation:"Informační systémy propojují lidi, data, technologie a služby do fungujícího celku – od univerzitních systémů až po moderní výzkumné infrastruktury.",allowSkip:!1},{id:"task-3-club-photo",stageId:"stage-life",stageTitle:"Studentský život a zázemí kampusu",title:"Studentský život v kampusu",description:`Rozhlédněte se kolem sebe. Jako prvák na vysoké škole máte povinnost užít si studentský život.

attempts:1,options:[{id:"A",text:"Provoz studentské IT učebny"},{id:"B",text:"Komerční cloud pro veřejnost"},{id:"C",text:"Výzkumné centrum pro AI a simulace"},{id:"D",text:"Správa univerzitních webů"}],correctAnswer:"C",explanation:"IT4Innovations je národní superpočítačové centrum a výzkumný ústav VŠB-TUO zaměřený na náročné vědecké simulace, umělou inteligenci, materiálový výzkum, modelování klimatu a vývoj léčiv.",hint:"Zamysli se nad tím, jaký gigantický výpočetní výkon superpočítače nabízejí pro vědu.",allowSkip:!1},{id:"task-4-supercomputer-photo-quiz",stageId:"stage-it4i",stageTitle:"Superpočítačové centrum IT4Innovations",title:"Který ze superpočítačů je na obrázku?",description:"Který ze superpočítačů je na obrázku?",type:"quiz",points:100,penalty:10,attempts:1,imageUrl:"https://www.ccb.cz/images_aqua/2025/09/datasal_2023_uvodu.jpg",imageAlt:"Datový sál superpočítačů IT4Innovations",options:[{id:"A",text:"Salomon"},{id:"B",text:"Karolina"},{id:"C",text:"Anselm"},{id:"D",text:"Barbora"}],correctAnswer:"B",explanation:"Na fotografii z datového sálu IT4Innovations je vlajkový superpočítač Karolina (uvedený do provozu v roce 2021).",hint:"Tento superpočítač byl uveden do provozu v roce 2021 a pyšní se výkonem přes 15 PFlop/s.",allowSkip:!1},{id:"task-kampus-vyznam",stageId:"stage-life",stageTitle:"Studentský život a zázemí kampusu",title:"Co je to kampus?",description:"Co nejlépe vystihuje slovo kampus?",type:"quiz",points:100,penalty:10,attempts:1,options:[{id:"A",text:"Studentská budova s více patry"},{id:"B",text:"Podzemní studentský komplex"},{id:"C",text:"Studentské městečko s fakultami"},{id:"D",text:"Soukromé centrum pro vědu a vývoj"}],correctAnswer:"C",explanation:"Slovo kampus označuje ucelený vysokoškolský areál – studentské městečko, kde se nachází fakulty, učebny, koleje, menzy, sportoviště i výzkumná centra na jednom místě.",hint:"Představte si rozlehlý areál VŠB-TUO v Porubě, kde jsou všechny fakulty, budovy i koleje pohromadě.",allowSkip:!1},{i **Superpočítač** je počítač, který je mnohonásobně výkonnější než běžný počítač. Dokáže za krátkou dobu udělat **obrovské množství výpočtů**, které by běžnému počítači trvaly velmi dlouho.
